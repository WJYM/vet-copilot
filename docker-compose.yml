version: "3"
services:
  vet-copilot-api:
    container_name: vet-copilot-api
    restart: always
    ports:
      - "9000:9000"
    expose:
      - "9000"
    build:
      context: ./
      dockerfile: ./docker_env/vet-copilot-api/Dockerfile
    environment:
      TZ: "Asia/Shanghai"
    volumes:
      - ./vet-copilot-api:/app
    networks:
      vet_copilot_network:
        ipv4_address: "177.8.0.2"

  vet-copilot-admin:
    container_name: vet-copilot-admin
    restart: always
    ports:
      - "80:80"
    expose:
      - "80"
    image: nginx:latest
    environment:
      TZ: "Asia/Shanghai"
    volumes:
      - ./docker_env/vet-copilot-admin/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./:/usr/share/nginx/html
    networks:
      vet_copilot_network:
        ipv4_address: "177.8.0.3"

  vet-copilot-task:
    container_name: vet-copilot-task
    restart: always
    build:
      context: ./
      dockerfile: ./docker_env/vet-copilot-task/Dockerfile
    environment:
      TZ: "Asia/Shanghai"
    volumes:
      - ./vet-copilot-task:/app
    networks:
      vet_copilot_network:
        ipv4_address: "177.8.0.4"

  vet_copilot-redis:
    container_name: vet_copilot-redis
    restart: always
    image: redis:latest
    ports:
      - "6379:6379"
    expose:
      - "6379"
    volumes:
      - ./docker_env/redis/conf/redis.conf:/etc/redis/redis.conf
    environment:
      TZ: "Asia/Shanghai"
    networks:
      vet_copilot_network:
        ipv4_address: "177.8.0.5"
    command: redis-server /etc/redis/redis.conf

  vet_copilot-mongo:
    container_name: vet_copilot-mongo
    restart: always
    image: mongo:latest
    ports:
      - "27017:27017"
    expose:
      - "27017"
    volumes:
      - ./docker_env/mongo/data:/data/db
      - ./docker_env/mongo/log:/data/log
      - ./docker_env/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js # 挂载初始化脚本
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin # root 用户名
      MONGO_INITDB_ROOT_PASSWORD: 123456 # root 用户密码
      TZ: "Asia/Shanghai" # 设置时区
    networks:
      vet_copilot_network:
        ipv4_address: "177.8.0.6"
    command: mongod --auth --bind_ip 0.0.0.0 # 启用身份验证和允许从任何IP连接

  vet_copilot-mysql:
    container_name: vet_copilot-mysql
    restart: always
    image: mysql:latest
    ports:
      - "3306:3306"
    expose:
      - "3306"
    volumes:
      - ./docker_env/mysql/conf:/etc/mysql/conf.d
      - ./docker_env/mysql/data:/var/lib/mysql
      - ./docker_env/mysql/logs:/logs
    environment:
      TZ: "Asia/Shanghai"
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: "vet_copilot"
    networks:
      vet_copilot_network:
        ipv4_address: "177.8.0.7"

networks:
  vet_copilot_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: "177.8.0.0/16"
          gateway: "177.8.0.1"